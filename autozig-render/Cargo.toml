[package]
name = "autozig-render"
version = "0.1.0"
edition = "2021"
authors = ["AutoZig Team"]
description = "A WGPU-based rendering library with 90% Zig core and 10% Rust wrapper, inspired by bevy_render"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
wgpu = "0.19"
raw-window-handle = "0.6"
thiserror = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
bitflags = "2.4"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
winit = "0.29"
env_logger = "0.11"
pollster = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1