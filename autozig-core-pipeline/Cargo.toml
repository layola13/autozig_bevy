[package]
name = "autozig-core-pipeline"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-repo/autozig"
description = "Core rendering pipeline for autozig-bevy (WebGPU/WASM)"
build = "build.rs"

[dependencies]
autozig = { path = "../../autozig", version = "0.1.2" }
autozig-render = { path = "../autozig-render", version = "0.1.0" }

[build-dependencies]
autozig-build = { path = "../../autozig/gen/build", version = "0.1.2" }

[lib]
crate-type = ["lib"]