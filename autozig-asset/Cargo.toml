[package]
name = "autozig-asset"
version = "0.1.0"
edition = "2021"

[dependencies]
autozig = { path = "../../autozig", version = "0.1.2" }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
futures-io = "0.3"
async-trait = "0.1"
autozig-ecs = { path = "../autozig-ecs" }
parking_lot = "0.12"
crossbeam-channel = "0.5"
ron = "0.8"
bevy_reflect = { version = "0.14", optional = true }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
autozig-build = { path = "../../autozig/gen/build", version = "0.1.2" }

[features]
default = []
reflect = ["bevy_reflect"]