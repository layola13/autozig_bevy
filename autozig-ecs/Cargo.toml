[package]
name = "autozig-ecs"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
ahash = "0.8"
fixedbitset = "0.5"
smallvec = "1.13"
nonmax = "0.5"
indexmap = "2.2"
derive_more = { version = "1.0", features = ["from"] }

# Zig integration
autozig-macro = { path = "../../autozig/macro" }

[build-dependencies]
cc = "1.0"

[lib]
path = "src/lib.rs"

[features]
default = []
trace = []
bevy_reflect = []
