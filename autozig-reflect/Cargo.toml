[package]
name = "autozig-reflect"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
autozig = { path = "../../autozig", version = "0.1.2" }
autozig-ecs = { path = "../autozig-ecs", version = "0.1.0" }
serde = { version = "1.0", optional = true }
erased-serde = { version = "0.4", optional = true }
thiserror = "1.0"

[build-dependencies]
autozig-build = { path = "../../autozig/gen/build", version = "0.1.2" }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
serialize = ["serde", "erased-serde"]