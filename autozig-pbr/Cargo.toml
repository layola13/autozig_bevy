[package]
name = "autozig-pbr"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-repo/autozig"
description = "Bevy PBR rendering system for WebGPU/WASM platforms"
build = "build.rs"

[dependencies]
autozig = { path = "../../autozig", version = "0.1.2" }
autozig-asset = { path = "../autozig-asset" }
autozig-ecs = { path = "../autozig-ecs" }
autozig-color = { path = "../autozig-color" }
autozig-transform = { path = "../autozig-transform" }
autozig-camera = { path = "../autozig-camera" }
autozig-mesh = { path = "../autozig-mesh" }

[build-dependencies]
autozig-build = { path = "../../autozig/gen/build", version = "0.1.2" }

[lib]
crate-type = ["lib"]