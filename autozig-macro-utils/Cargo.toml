[package]
name = "autozig-macro-utils"
version = "0.1.0"
edition = "2021"
authors = ["AutoZig Contributors"]
description = "Macro utility functions for AutoZig Bevy implementation"
license = "MIT OR Apache-2.0"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]

[lib]
proc-macro = false