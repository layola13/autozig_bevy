[package]
name = "autozig-scene"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bevy scene management for WebGPU/WASM platforms"

[dependencies]
autozig = { path = "../../autozig", version = "0.1.2" }
autozig-app = { path = "../autozig-app" }
autozig-ecs = { path = "../autozig-ecs" }
autozig-asset = { path = "../autozig-asset" }
autozig-transform = { path = "../autozig-transform" }
autozig-camera = { path = "../autozig-camera" }

[lib]
crate-type = ["lib"]
