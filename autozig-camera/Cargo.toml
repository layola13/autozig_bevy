[package]
name = "autozig-camera"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-repo/autozig"
description = "Bevy camera system for WebGPU/WASM platforms"
build = "build.rs"

[dependencies]
autozig = { path = "../../autozig", version = "0.1.2" }
autozig-ecs = { path = "../autozig-ecs", version = "0.1.0" }
autozig-app = { path = "../autozig-app" }

[build-dependencies]
autozig-build = { path = "../../autozig/gen/build", version = "0.1.2" }

[dev-dependencies]
approx = "0.5"

[[test]]
name = "camera_tests"
path = "tests/camera_tests.rs"