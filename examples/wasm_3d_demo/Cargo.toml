[package]
name = "autozig-wasm-3d-demo"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# AutoZig core (for include_zig! macro)
autozig = { path = "../../../autozig" }

# WASM bindings
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Window"] }

# Optional: Better panic messages in WASM
console_error_panic_hook = { version = "0.1", optional = true }

[build-dependencies]
autozig-build = { path = "../../../autozig/gen/build" }
anyhow = "1.0"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "z"     # 优化大小
lto = false         # 禁用 LTO 以保留符号（关键：防止内存访问越界）
codegen-units = 1   # 单个代码生成单元

# WebAssembly 配置 - 防止过度优化导致的内存访问问题
[profile.release.package."*"]
opt-level = 3